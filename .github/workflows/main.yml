
name: OsintGram Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Download source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleAfatDebug

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: OsintGram-debug
          path: '**/build/outputs/apk/**/*.apk'
